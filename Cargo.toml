[package]
name = "rogue-net"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust implementation of the RogueNet neural network"
readme = "README.md"
repository = "https://github.com/entity-neural-network/rogue-net-rs"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
ndarray = { version = "0.17", features = ["approx"] }
rand = "0.10"
rmpv = "1.3"
statrs = "0.19"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
tar = "0.4.46"

[[bin]]
name = "rogue-net"
path = "src/bin/main.rs"
required-features = ["cli"]

[features]
# Command-line tool for archiving and checking checkpoints.
cli = ["dep:clap"]
